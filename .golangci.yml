# Configuration de golangci-lint. L'outil lui-même est épinglé dans `go.mod` (`tool`), donc un clone
# frais lance exactement la même version que la CI, sans rien installer.
version: "2"

linters:
  default: standard
  enable:
    # Une réponse HTTP dont le corps n'est pas fermé fuit une connexion — et le BFF passe son temps à
    # relayer l'API Admin.
    - bodyclose
    # Une comparaison d'erreur par `==` ou par message casse dès qu'un appelant enveloppe : tout le
    # modèle d'erreur du §1.4 repose sur `errors.Is` / `errors.As`.
    - errorlint
    - gocritic
    - gosec
    # Une erreur avalée dans une branche de garde est le défaut que l'invariant (c) ne pardonne pas.
    - nilerr
    - revive
    - testifylint
    - usetesting

  settings:
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    generated: lax
    rules:
      # Les tests ont le droit de paniquer sur une erreur d'échafaudage : c'est leur façon d'échouer.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
