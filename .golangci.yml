# Configuration de golangci-lint. L'outil lui-même est épinglé dans `go.mod` (`tool`), donc un clone
# frais lance exactement la même version que la CI, sans rien installer.
version: "2"

linters:
  default: standard
  enable:
    # Une réponse HTTP dont le corps n'est pas fermé fuit une connexion — et le BFF passe son temps à
    # relayer l'API Admin.
    - bodyclose
    # Une comparaison d'erreur par `==` ou par message casse dès qu'un appelant enveloppe : tout le
    # modèle d'erreur du §1.4 repose sur `errors.Is` / `errors.As`.
    - errorlint
    # `internal/config` affirme être le seul à lire l'environnement. Sans cette porte, c'était une
    # phrase de documentation : une lecture ailleurs se découvre manquante à la première requête qui
    # l'emprunte, c'est-à-dire en production.
    - forbidigo
    - gocritic
    - gosec
    # Une erreur avalée dans une branche de garde est le défaut que l'invariant (c) ne pardonne pas.
    - nilerr
    - revive
    - testifylint
    - usetesting

  settings:
    forbidigo:
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ|Setenv|Unsetenv|Clearenv)$
          msg: la configuration se lit dans internal/config, une seule fois, au démarrage (§1.8)
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    generated: lax
    rules:
      # La seule ligne du dépôt qui lit l'environnement, et qui le passe au chargeur. `internal/config`
      # n'a pas d'exemption parce qu'il n'en a pas besoin : sa source d'environnement lui est injectée,
      # il n'importe pas `os`.
      - path: cmd/dashboard/main\.go
        linters:
          - forbidigo
      # Les tests ont le droit de paniquer sur une erreur d'échafaudage : c'est leur façon d'échouer.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
