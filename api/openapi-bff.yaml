# Le contrat du BFF : **la** frontière entre les deux moitiés du produit. Il est écrit à la main, et
# les deux côtés en dérivent — les types serveur Go par `oapi-codegen`, les types client TypeScript
# par `openapi-typescript`. L'inverse — dériver le contrat du code Go — ferait du serveur la source
# de vérité et rendrait toute rupture invisible au client jusqu'à l'exécution.
#
# **Ce n'est pas le contrat de la passerelle.** Il en reprendra le vocabulaire (`link_status`,
# `breaker_state`, §1.5) mais sa forme est celle dont l'écran a besoin : le BFF compose, filtre et
# masque. Là où les deux formes divergeront, ce fichier le commentera.
#
# Les clés de chemin sont **relatives à `servers.url`**, qui porte le préfixe `/api`. C'est la forme
# normale d'un document OpenAPI.
#
# Ce qui l'acquitte devant la porte anti-copie de `internal/gateway` est le **compte d'opérations
# qu'il déclare en commun avec les contrats de la passerelle**, et rien d'autre. **Re-sondé le
# 27/08/2026** à l'ajout des quatre opérations WebAuthn de step-024, en rejouant la mesure plutôt
# qu'en la déduisant :
#
#   openapi-admin.yaml   0 signature sur 28  → sous le seuil
#   openapi-public.yaml  1 signature sur 5   → sous le seuil
#
# Inchangé pour la quatrième mesure d'affilée, et la raison est vérifiable : le dénominateur est
# l'échantillon **de la passerelle**, pas le nombre d'opérations de ce fichier. La seule signature
# commune est `/health`, que le contrat public déclare aussi ; `/auth/*` n'existe dans aucun des deux
# contrats amont, dont les opérations sont toutes sous `/admin/…` ou parmi `/messages`, `/account`,
# `/health`.
#
# Le seuil est la moitié. Deux versions successives de ce commentaire ont désigné une autre cause —
# les chemins relatifs, puis l'absence de marque d'identité — et les deux étaient fausses : la marque
# d'identité du contrat Admin est d'ailleurs tenue pour présente par défaut, ce contrat-là n'en
# déclarant aucune. **La conséquence pratique est là** : c'est en ajoutant des opérations que ce
# fichier s'approchera du seuil, pas en changeant son titre.
openapi: 3.1.0

info:
  title: Tableau de bord Admin — API du BFF
  version: 0.1.0
  description: |
    Surface servie au navigateur. Le client ne parle qu'à elle : le jeton machine, le mTLS et la base
    vivent sous `internal/`, hors d'atteinte du bundle (invariant d).

# Le seul consommateur de `servers` dans le dépôt est `kin-openapi`, dans le scénario godog de
# `cmd/dashboard` : c'est lui, et lui seul, qui lie ce préfixe au `r.Route("/api", …)` du routeur.
# Ni `oapi-codegen` ni `openapi-typescript` ne le lisent — mesuré, `/api` remplacé par `/v1` laisse
# `make check-generated` vert et les trois sorties identiques, et fait tomber le scénario.
servers:
  - url: /api
    description: Relatif à l'origine qui a servi la SPA — le client n'écrit jamais d'adresse absolue.

paths:
  /health:
    get:
      operationId: health
      summary: Sonde de vivacité
      description: |
        Répond « le process est en vie », pas « le service est disponible ». Ne touche ni la base ni
        la passerelle : y brancher une dépendance ferait redémarrer un serveur sain parce qu'une
        autre brique est tombée. La sonde de disponibilité arrive en step-186.
      responses:
        '200':
          description: Le process répond.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/login:
    post:
      operationId: login
      summary: Premier facteur — adresse et mot de passe
      description: |
        Vérifie l'adresse et le mot de passe, ouvre une session de **premier facteur** et rend un
        **challenge de second facteur** à usage unique et de courte durée. La session n'est pas
        élevée : c'est `POST /auth/mfa/verify` qui l'élève, avec le code que ce challenge accompagne.

        Le cookie de session n'est pas déclaré ici, et c'est délibéré : il est `HttpOnly`, donc le
        navigateur **interdit** au client de le lire. Le déclarer en en-tête de réponse le ferait
        apparaître dans les types engendrés comme une valeur lisible, ce qu'il n'est pas.

        Le refus ne dit jamais lequel des deux facteurs a échoué. Même code, même corps et **même
        durée** pour « adresse inconnue », « mot de passe faux » et « compte désactivé » : les
        distinguer dirait à une machine quelles adresses existent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Le premier facteur est franchi ; le second reste à fournir.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaChallenge' }
        '400':
          # Cette réponse n'est pas décorative. `POST /auth/login` est la **première** opération du
          # contrat à porter un corps de requête, donc la première à donner un site d'appel au
          # gestionnaire d'erreur de décodage (`internal/bff/router.go`, `newContractHandler`). Un
          # corps illisible rend ce DTO, et un scénario qui valide la réponse contre ce fichier
          # échouerait sur un statut non déclaré.
          description: La requête n'a pas la forme que la route attend.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: |
            Les identifiants ne conviennent pas. Le corps est le même que l'adresse soit inconnue,
            que le mot de passe soit faux ou que le compte soit désactivé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            Trop d'échecs sur ce compte ou depuis cette adresse. Le message porte la durée restante :
            un refus muet ferait retenter l'opérateur, puis ouvrir un ticket.
          headers:
            Retry-After:
              description: |
                Secondes restant à attendre. Un entier et jamais une date HTTP : une date oblige le
                client à faire confiance à sa propre horloge pour la soustraire.
              required: true
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      operationId: me
      summary: L'opérateur connecté et ce qu'il a le droit de faire
      description: |
        Le **seul** endroit d'où le client apprend ses droits. L'interface se rend sur des
        permissions, jamais sur un rôle codé en dur (§4.2).

        Aucun rôle dans le corps, et c'est la raison même : une liste de rôles rendue au navigateur
        invite à réintroduire le contrôle de rôle côté client, que la spec interdit. Les permissions
        décident ; les rôles restent au serveur tant qu'aucun écran n'a besoin de les afficher.
      responses:
        '200':
          description: Une session vit, et voici ce qu'elle ouvre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          description: |
            Aucune session vivante. Le corps est le même qu'il n'y ait pas de cookie, que son sceau
            ne colle pas, que la session soit échue, oisive, fermée, ou que le compte ait été
            désactivé : les distinguer dirait à qui teste un cookie ce qu'il vaut encore.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      operationId: logout
      summary: Fermer la session
      description: |
        La ligne de session est **supprimée**, et le cookie expiré. Le second sans le premier ne
        protège rien : un cookie qu'on garde se rejoue.

        **Le même statut sans session**, et c'est délibéré : se déconnecter est une demande d'état,
        et l'état est atteint. Un refus obligerait le client à traiter un cas sans conséquence, et
        dirait à qui teste un cookie s'il vaut encore quelque chose. C'est aussi le moment où
        l'opérateur veut le plus que ce bouton marche — sur une session déjà morte.

        Aucun corps : rien à dire que le statut ne dise. Le cookie d'expiration n'est pas déclaré
        ici, pour la même raison qu'à la connexion — il est `HttpOnly`, le client ne le lit pas.
      responses:
        '204':
          description: La session est fermée, qu'elle ait existé ou non.

  /auth/mfa/totp/enroll:
    post:
      operationId: enrollTotp
      summary: Enrôler une application d'authentification
      description: |
        Tire un secret TOTP, le chiffre au repos, et rend **une seule fois** de quoi le configurer :
        l'URI `otpauth://` que l'écran dessinera en QR, le secret en clair pour la saisie manuelle, et
        dix codes de récupération. Rien de tout cela n'est réaffichable ensuite — aucune action
        « révéler » n'existe, et la seule sortie est un réenrôlement.

        Le serveur rend l'**URI** et non une image : dessiner le QR appartient au client (step-028), et
        l'inverse ferait dépendre le serveur d'une bibliothèque de rendu.

        L'enrôlement n'élève pas la session : c'est `POST /auth/mfa/verify` qui le fait, avec le
        premier code. Tant qu'il n'a pas eu lieu, la session reste au premier facteur.

        **Remplacer un authentificateur exige de présenter celui qu'on remplace.** Sans cette
        exigence, le geste qui détruit un facteur serait protégé moins que celui qui l'utilise : le
        seul rempart serait le bit d'élévation, qui vaut douze heures, donc un cookie capté suffirait
        à évincer définitivement l'opérateur — le secret et les dix codes de récupération partent
        ensemble.

        **Deux chemins d'enrôlement et non un seul**, contrairement à ce que le §5.1 annonçait : la
        cérémonie WebAuthn de step-024 rend une forme entièrement différente, et les réunir sous une
        opération obligerait à un `oneOf` de réponse dont le code engendré fait un type opaque. La
        vérification, elle, rend le même 204 des deux côtés et reste une seule opération.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpEnrollmentRequest' }
      responses:
        '200':
          description: L'authentificateur est enrôlé ; voici ce qui ne sera plus jamais montré.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpEnrollment' }
        '400':
          description: La requête n'a pas la forme que la route attend.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: |
            Aucune session vivante. Un enrôlement anonyme permettrait d'attacher un authentificateur
            à un compte qu'on ne détient pas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Un second facteur est déjà en place, et rien n'a été présenté qui le prouve — ou ce qui a
            été présenté n'a pas été accepté. Le remplacer sans cette preuve reviendrait à le
            contourner : quiconque détient le mot de passe, ou un cookie de session élevée, s'en
            enrôlerait un neuf et évincerait l'opérateur.

            Le refus dit ce qu'il faut faire — présenter un code de l'authentificateur en place, ou
            l'un des codes de récupération. Si les deux sont perdus, la sortie est la réinitialisation
            par un administrateur, que la gestion des opérateurs apportera : elle n'existe pas encore,
            et le message ne prétend pas le contraire.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      summary: Second facteur — code TOTP, code de récupération ou assertion de passkey
      description: |
        Vérifie le second facteur et **élève** la session ouverte par `POST /auth/login`. Le jeton de
        session est régénéré au passage : sans cela, un cookie obtenu avant le second facteur resterait
        valable après, ce qui est la fixation de session.

        Il exige **les deux** : le cookie de session, qui dit de qui il s'agit, et le challenge rendu
        par la connexion, qui dit que le mot de passe vient d'être présenté il y a moins de cinq
        minutes. Aucun des deux ne dit ce que dit l'autre — sans le challenge, une session de premier
        facteur volée resterait élevable pendant douze heures par qui obtient un code.

        Le challenge n'est consommé qu'en cas de **succès** : une faute de frappe ne doit pas obliger à
        refaire toute la connexion. *(Correction step-024 : une rédaction précédente lui prêtait un
        compteur d'échecs propre. Il a existé le temps d'une revue, puis a été retiré — il doublait le
        compteur par opérateur décrit juste après, et deux gardes dont l'une masque l'autre valent une
        garde et une illusion.)*

        Ce qui borne la recherche exhaustive d'un code à six chiffres est **un second compteur, par
        opérateur**, toutes connexions confondues : le premier ne suffirait pas, puisqu'une connexion
        réussie n'incrémente aucun compteur et que qui détient le mot de passe émet donc autant de
        challenges qu'il veut. Son franchissement rend un 429.

        Aucun corps en retour : ce que la session ouvre désormais se lit sur `GET /auth/me`, qui reste
        le seul endroit d'où le client apprend ses droits.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerification' }
      responses:
        '204':
          description: Le second facteur est vérifié ; la session est élevée.
        '400':
          description: La requête n'a pas la forme que la route attend.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: |
            Le second facteur n'a pas été accepté. Le corps est le même que le code soit faux ou déjà
            servi, que le challenge soit inconnu, échu, consommé, épuisé, ou qu'il appartienne à un
            autre opérateur, qu'aucune session ne vive, ou qu'elle soit morte entre-temps : les
            distinguer dirait à une machine où elle en est.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            Trop d'essais de second facteur sur ce compte. Le message porte la durée restante, comme
            celui de la connexion : un refus muet ferait retenter l'opérateur, puis ouvrir un ticket.

            Il se distingue du 401, et c'est délibéré : ce qu'il révèle — « le seuil est atteint » —
            est ce que l'attaquant constate de toute façon en étant refusé, et le taire priverait
            l'opérateur légitime de la seule information qui lui dise quoi faire.
          headers:
            Retry-After:
              description: Secondes restant à attendre. Un entier et jamais une date HTTP.
              required: true
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/mfa/webauthn/register/begin:
    post:
      operationId: beginWebauthnRegistration
      summary: Ouvre l'enregistrement d'une passkey
      description: |
        Tire les options que le navigateur passera à `navigator.credentials.create()`, et ouvre un défi
        de courte durée **lié à la session en cours**.

        **Deux opérations et non une**, contrairement à l'enrôlement TOTP : WebAuthn est en deux temps
        par nature — le serveur tire un défi, l'appareil le signe. Les réunir obligerait à rendre le
        défi devinable par l'appelant, ce qui est exactement ce qu'un défi ne doit pas être.

        Un seul défi vit à la fois pour une session : rappeler cette route en éteint le précédent.
        Deux onglets rendraient sinon indécidable celui que la finition doit relire.

        Les passkeys déjà détenues sont exclues des options : sans cela, l'appareil en enregistrerait
        une seconde que l'opérateur ne saurait pas distinguer de la première.
      responses:
        '200':
          description: Les options de création, à passer telles quelles au navigateur.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnRegistrationOptions' }
        '401':
          description: Aucune session vivante.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Un second facteur est déjà en place et la session n'est pas élevée. En ajouter un sans
            l'élévation permettrait à quiconque détient le mot de passe de se donner un second facteur,
            donc de contourner celui qui existe.

            Ce n'est pas une panne : c'est le cas d'un opérateur qui ajoute un appareil. Le refus dit
            par où passer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/mfa/webauthn/register/finish:
    post:
      operationId: finishWebauthnRegistration
      summary: Enregistre la passkey que l'appareil vient de produire
      description: |
        Confronte la réponse de l'authentificateur au défi ouvert par la route précédente, et
        enregistre la passkey.

        Le défi est consommé quoi qu'il arrive ici — succès comme échec — parce qu'il a été signé :
        contrairement à un code mal tapé, une réponse refusée ne se retente pas sur le même défi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebauthnRegistration' }
      responses:
        '200':
          description: La passkey est enregistrée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnCredential' }
        '400':
          description: La requête n'a pas la forme que la route attend.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: |
            Aucune session vivante, ou la cérémonie n'a pas abouti. Le corps du second cas est le même
            qu'aucun défi ne soit ouvert, qu'il soit échu ou déjà servi, que l'origine ne soit pas
            celle qu'on attendait, que la signature soit fausse, ou que **cette clé soit déjà
            enregistrée** — ici ou ailleurs : les distinguer dirait à qui détient l'authentificateur
            s'il est enrôlé quelque part.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Un second facteur a été mis en place **entre l'ouverture de la cérémonie et sa finition**,
            et la session n'est pas élevée. Le défi vit cinq minutes : sans ce contrôle, une cérémonie
            ouverte quand l'enrôlement était libre attacherait encore une passkey après coup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/mfa/webauthn/assert/begin:
    post:
      operationId: beginWebauthnAssertion
      summary: Ouvre une assertion de passkey
      description: |
        Tire les options que le navigateur passera à `navigator.credentials.get()`. Comme
        l'enregistrement, la cérémonie est en deux temps ; contrairement à lui, elle **se finit sur**
        `POST /auth/mfa/verify`, avec `method: webauthn` — la vérification reste une seule opération,
        et rend le même 204 pour les trois méthodes.

        Elle n'exige pas de challenge de connexion : c'est la finition qui l'exige, comme pour un code
        TOTP. Ouvrir une cérémonie ne prouve rien et n'élève rien.
      responses:
        '200':
          description: Les options d'assertion, à passer telles quelles au navigateur.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnAssertionOptions' }
        '400':
          description: Aucune passkey n'est enregistrée ; il n'y a pas de cérémonie à ouvrir.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Aucune session vivante.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/mfa/webauthn/passkeys/{passkeyId}:
    delete:
      operationId: deleteWebauthnPasskey
      summary: Retire une passkey
      description: |
        Retire une passkey de l'opérateur de la session.

        **Seule opération de ce préfixe qui soit une mutation**, et la seule que step-025 devra garder
        plutôt qu'exempter. Elle exige une session élevée — mais **pas** de présenter la passkey qu'on
        retire : on la retire précisément quand on ne l'a plus, appareil perdu ou clé cassée, et
        l'exiger rendrait le geste impossible dans le seul cas qui le motive.

        `passkeyId` est l'identifiant de la passkey tel que l'enregistrement l'a rendu, jamais
        l'identifiant que l'authentificateur s'est choisi — celui-là est long, binaire, et n'a aucune
        raison de traverser une URL.
      parameters:
        - name: passkeyId
          in: path
          required: true
          description: L'identifiant rendu à l'enregistrement.
          schema: { type: string }
      responses:
        '204':
          description: La passkey est retirée.
        '401':
          description: |
            Aucune session vivante, ou cette passkey n'appartient pas à l'opérateur — le même corps
            pour les deux, parce que distinguer « elle existe mais pas chez vous » de « elle n'existe
            pas » dirait ce que possède quelqu'un d'autre.

            La session **vivante mais non élevée**, elle, rend un 409 : la confondre avec les deux
            précédentes ferait lire « reconnectez-vous » à un opérateur dont le remède est l'inverse —
            se reconnecter rend une session de premier facteur, donc le même refus.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Deux causes, deux codes. `mfa_elevation_required` : la session n'a pas franchi le second
            facteur. `mfa_last_factor` : c'est le dernier facteur de l'opérateur, et le retirer
            l'enfermerait dehors.

            Les deux nomment ce qui manque et par où passer — un contrôle interdit est désactivé et
            expliqué, jamais masqué.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  schemas:
    Health:
      type: object
      description: Réponse de la sonde de vivacité.
      additionalProperties: false
      properties:
        status:
          # Un enum plutôt qu'une chaîne libre : il contraint la **valeur** et pas seulement la forme,
          # ce qui donne du mordant à la validation de la réponse contre ce fichier. Les constantes
          # engendrées sont préfixées de leur type (`always-prefix-enum-values`), sans quoi celle-ci
          # s'appellerait `Ok` dans le paquet qui portera toutes les routes du produit.
          type: string
          enum: [ok]
      required: [status]

    LoginRequest:
      type: object
      description: Le premier facteur, tel que le formulaire de connexion l'envoie.
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 320
        password:
          # La borne n'est pas cosmétique : chaque tentative coûte un argon2id de 64 MiB au serveur,
          # et un corps sans borne en ferait une arme. Elle est **aussi** appliquée en Go — rien dans
          # ce dépôt ne valide une requête à l'exécution contre ce fichier.
          type: string
          minLength: 1
          maxLength: 4096
      required: [email, password]

    MfaChallenge:
      type: object
      description: |
        Le challenge de second facteur. C'est un objet en base et non un jeton signé : il doit être
        révocable à la seconde où il est consommé, ce qu'un jeton sans état ne permet pas. Le serveur
        n'en garde que l'empreinte — cette valeur n'est rendue qu'une fois.
      additionalProperties: false
      properties:
        challenge:
          type: string
          minLength: 43
        expiresAt:
          type: string
          format: date-time
      required: [challenge, expiresAt]

    Me:
      type: object
      description: Ce qu'une session vivante apprend au client.
      additionalProperties: false
      properties:
        operator:
          $ref: '#/components/schemas/CurrentOperator'
        permissions:
          # L'union des permissions des rôles détenus, sans doublon et triée. Les 44 clés ne sont
          # **pas** énumérées en `enum` : le catalogue de `internal/permissions` fait foi et engendre
          # déjà `web/src/lib/permissions.gen.ts`. Deux listes pour un seul vocabulaire finiraient
          # figées chacune par sa propre porte, puis divergeraient.
          type: array
          items: { type: string }
        elevated:
          # Le second facteur a-t-il été vérifié dans cette session. `POST /auth/mfa/verify` le fait
          # passer à `true` — et pour toute la durée de la session, sans seconde échéance : redemander
          # un code au milieu d'une opération est ce qui fait desserrer une garde. step-025 exigera
          # cet état pour toute écriture.
          type: boolean
        secondFactors:
          $ref: '#/components/schemas/SecondFactors'
        absoluteExpiresAt:
          # Le nom porte « absolute » parce que **la session meurt souvent avant** : elle expire aussi
          # après deux heures sans requête, et l'écart atteint dix heures dans le cas courant. Nommé
          # `expiresAt`, ce champ invitait step-027 à en faire un décompte qui aurait menti.
          #
          # L'échéance glissante n'est pas rendue : elle se déplace à chaque requête et serait périmée
          # à l'instant où le client la lit. Ce champ est donc une **borne haute**, pas une date de
          # déconnexion.
          type: string
          format: date-time
      required: [operator, permissions, elevated, absoluteExpiresAt, secondFactors]

    SecondFactors:
      type: object
      description: |
        Ce que l'opérateur détient comme second facteur — jamais ce qu'il vaut. Un booléen et un
        compte ne se rejouent pas, là où le secret et les codes eux-mêmes ne sont montrés qu'une fois,
        à l'enrôlement.

        C'est ce qui permet à l'écran de savoir s'il conduit à l'enrôlement ou au challenge, sans
        essayer l'un pour découvrir qu'il fallait l'autre.
      additionalProperties: false
      properties:
        totp:
          type: boolean
        recoveryCodesRemaining:
          # Le rappel que la fiche exige : dix codes remis, et l'opérateur doit voir fondre sa réserve
          # avant qu'elle ne soit vide, pas au moment où elle l'est.
          type: integer
          minimum: 0
        passkeys:
          # Un compte et non une liste : ce que l'écran doit savoir pour se rendre est s'il conduit à
          # l'enrôlement ou au challenge. L'inventaire qui nomme les appareils appartient à l'écran de
          # gestion de step-028.
          #
          # C'est aussi ce qui permet au client de prévoir qu'un retrait sera refusé — dernière passkey
          # et pas de TOTP — donc de désactiver le contrôle en l'expliquant, plutôt que de laisser
          # l'opérateur le découvrir sur un 409.
          type: integer
          minimum: 0
      required: [totp, recoveryCodesRemaining, passkeys]

    TotpEnrollmentRequest:
      type: object
      description: |
        Ce qu'un enrôlement présente : **rien** la première fois, et une preuve du facteur en place
        pour le remplacer.

        Le premier enrôlement n'a rien à prouver — il n'y a pas encore de facteur, et la session de
        premier facteur dit déjà de qui il s'agit. Le remplacement, lui, **détruit** l'authentificateur
        en place et ses dix codes de récupération : il exige donc de présenter ce qu'on détruit.

        **Pourquoi un code et non un challenge frais**, alors que le challenge est ce que la
        vérification exige : se reconnecter pour en obtenir un ferme la session présentée et la
        désélève — c'est la remédiation de step-022 — donc un remplacement exigeant à la fois
        l'élévation et un challenge frais serait **inatteignable**. Mesuré : le scénario qui l'exerçait
        rendait 409 en boucle. Un code du facteur en place est par ailleurs une preuve plus forte que
        le mot de passe : un cookie de session élevée capté ne le donne pas.

        Un code de récupération convient aussi. L'opérateur qui a perdu son téléphone est précisément
        celui qui veut réenrôler, et n'exiger qu'un code TOTP en ferait une impasse.
      additionalProperties: false
      properties:
        method:
          type: string
          enum: [totp, recovery_code]
        code:
          type: string
          minLength: 1
          maxLength: 64
      required: []

    TotpEnrollment:
      type: object
      description: |
        Rendu **une seule fois**, à l'enrôlement. Aucune route ne le rend ensuite : le secret est
        chiffré au repos et les codes sont hachés, donc le serveur lui-même ne saurait plus les
        recomposer.
      additionalProperties: false
      properties:
        secret:
          # En base32, pour la saisie manuelle sur un poste sans caméra. C'est la même valeur que
          # l'URI porte — deux valeurs différentes feraient qu'une des deux voies d'enrôlement
          # marcherait et pas l'autre.
          type: string
        otpauthUri:
          # `otpauth://totp/…`, avec ses quatre paramètres écrits plutôt que laissés au défaut.
          # L'image est dessinée par le client (step-028) : le serveur ne dépend d'aucune
          # bibliothèque de rendu.
          type: string
        recoveryCodes:
          type: array
          items: { type: string }
      required: [secret, otpauthUri, recoveryCodes]

    MfaVerification:
      type: object
      description: |
        Ce que le formulaire du second facteur envoie. Le challenge vient de la réponse à
        `POST /auth/login` ; le cookie de session, lui, voyage tout seul.
      additionalProperties: false
      properties:
        challenge:
          type: string
          minLength: 43
        method:
          # Un discriminant explicite plutôt qu'un « essayer l'un puis l'autre » : essayer les deux
          # ferait payer les argon2id du chemin de récupération à chaque code TOTP faux, et la
          # durée de la réponse dirait alors laquelle des deux voies a été prise.
          #
          type: string
          enum: [totp, recovery_code, webauthn]
        code:
          # La borne haute vaut pour les deux méthodes qui en portent un : six chiffres d'un côté,
          # onze caractères de l'autre. Elle n'est pas cosmétique — le chemin de récupération coûte un
          # argon2id par code restant, et un corps sans borne en ferait une arme.
          #
          # **Facultatif depuis step-024** : une assertion de passkey n'a pas de code. Le serveur exige
          # l'un ou l'autre selon la méthode et rend 400 sinon — c'est le patron que
          # `TotpEnrollmentRequest` emploie déjà, et le contrat ne sait pas exprimer deux champs qui
          # s'excluent.
          type: string
          minLength: 1
          maxLength: 64
        assertion:
          # Ce que `navigator.credentials.get()` a produit, transmis **tel quel**.
          #
          # Un objet libre, et c'est le seul du contrat. Sa forme appartient à la spécification
          # WebAuthn et c'est la bibliothèque qui l'analyse ; la retyper ici en ferait deux rédactions
          # dont une périmerait — le même arbitrage que la colonne `ceremony` de la migration 00008.
          #
          # L'asymétrie avec les options rendues plus bas, qui sont des DTO déclarés champ par champ,
          # est délibérée : c'est **en sortie** que déclarer garde quelque chose, puisqu'un champ
          # absent du struct ne peut pas fuir. En entrée, un champ non déclaré est simplement ignoré.
          #
          # `additionalProperties: true` est nécessaire et non décoratif : sans lui, le générateur
          # TypeScript rend `Record<string, never>`, un type où aucune clé ne peut être écrite. Mesuré
          # — le client de step-027 n'aurait rien pu y mettre.
          type: object
          additionalProperties: true
      required: [challenge, method]

    WebauthnCredentialDescriptor:
      type: object
      description: |
        Une passkey désignée dans des options de cérémonie — exclue d'un enregistrement, ou admise
        pour une assertion. `id` est l'identifiant que l'authentificateur s'est choisi, en base64url.
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [public-key]
        id:
          type: string
        transports:
          type: array
          items: { type: string }
      required: [type, id]

    WebauthnRegistrationOptions:
      type: object
      description: |
        Ce que le client passe **tel quel** à `navigator.credentials.create()`. L'enveloppe `publicKey`
        est ce que l'API du navigateur attend ; la retirer obligerait le client à la reconstruire.

        Chaque champ est déclaré, plutôt que de sérialiser le type de la bibliothèque : c'est en sortie
        que la règle du DTO garde quelque chose — un champ absent d'ici ne peut pas fuir, et un bump de
        la bibliothèque qui en ajouterait un ne le ferait pas traverser en silence.

        Ce qui n'y figure pas est ce que nous ne demandons pas : aucune extension, aucune préférence
        d'attestation. Nous ne vérifions le modèle d'aucun authentificateur — il n'y a pas de registre
        de métadonnées ici — donc une attestation ne serait pas contrôlée, et une valeur qu'on ne
        contrôle pas vaut moins que son absence.
      additionalProperties: false
      properties:
        publicKey:
          type: object
          additionalProperties: false
          properties:
            rp:
              type: object
              additionalProperties: false
              properties:
                id: { type: string }
                name: { type: string }
              required: [id, name]
            user:
              type: object
              additionalProperties: false
              properties:
                # Le *user handle* que l'appareil mémorisera, en base64url. C'est l'identifiant
                # d'opérateur et non son adresse : il est stocké en clair par l'appareil et voyage
                # dans chaque assertion, alors qu'un UUID ne dit rien de personne.
                id: { type: string }
                name: { type: string }
                displayName: { type: string }
              required: [id, name, displayName]
            challenge: { type: string }
            pubKeyCredParams:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  type:
                    type: string
                    enum: [public-key]
                  # L'identifiant COSE de l'algorithme, un entier négatif (-7 pour ES256).
                  alg: { type: integer }
                required: [type, alg]
            timeout: { type: integer }
            excludeCredentials:
              type: array
              items: { $ref: '#/components/schemas/WebauthnCredentialDescriptor' }
            authenticatorSelection:
              type: object
              additionalProperties: false
              properties:
                residentKey: { type: string }
                userVerification: { type: string }
          required: [rp, user, challenge, pubKeyCredParams]
      required: [publicKey]

    WebauthnAssertionOptions:
      type: object
      description: |
        Ce que le client passe **tel quel** à `navigator.credentials.get()`. Même enveloppe et même
        règle que pour l'enregistrement.

        `allowCredentials` énumère les passkeys de l'opérateur : la session dit déjà de qui il s'agit,
        donc l'assertion n'a pas à être découvrable, et l'appareil sait quoi proposer.
      additionalProperties: false
      properties:
        publicKey:
          type: object
          additionalProperties: false
          properties:
            challenge: { type: string }
            timeout: { type: integer }
            rpId: { type: string }
            allowCredentials:
              type: array
              items: { $ref: '#/components/schemas/WebauthnCredentialDescriptor' }
            userVerification: { type: string }
          required: [challenge]
      required: [publicKey]

    WebauthnRegistration:
      type: object
      description: |
        Ce que `navigator.credentials.create()` a produit, transmis **tel quel**.

        Un objet libre, pour la même raison que le champ `assertion` de `MfaVerification` : sa forme
        appartient à la spécification WebAuthn, la bibliothèque l'analyse, et la retyper ici en ferait
        deux rédactions dont une périmerait.
      additionalProperties: false
      properties:
        attestation:
          # `additionalProperties: true` pour la même raison que le champ `assertion` de
          # `MfaVerification` : sans lui, le type TypeScript n'accepte aucune clé.
          type: object
          additionalProperties: true
      required: [attestation]

    WebauthnCredential:
      type: object
      description: |
        La passkey qui vient d'être enregistrée. **Seul son identifiant**, et c'est ce dont le client a
        besoin : de quoi la retirer plus tard.

        Rien de la clé, pas même publique. Non qu'elle soit secrète — elle ne l'est pas, et c'est ce
        qui dispense sa table du chiffrement au repos — mais parce qu'aucun écran n'en fait rien, et
        qu'un champ qu'on rend est un champ qu'on doit tenir.
      additionalProperties: false
      properties:
        id: { type: string }
      required: [id]

    CurrentOperator:
      type: object
      description: |
        De quoi nommer l'opérateur à l'écran, et rien de plus. Ni `password_hash`, ni
        `mfa_totp_secret`, ni les identifiants WebAuthn : le type de domaine du store ne traverse pas
        cette frontière (§1.11), et `additionalProperties: false` fait refuser tout champ qu'un
        serveur ajouterait par mégarde.
      additionalProperties: false
      properties:
        # `format: uuid` n'est pas déclaré, et c'est un arbitrage plutôt qu'un oubli. Il n'achèterait
        # aucune validation — `kin-openapi` ignore les formats qu'on ne lui a pas enregistrés — mais
        # ferait engendrer un `openapi_types.UUID`, donc une conversion depuis le `uuid::text` que la
        # base rend, dont la branche d'erreur serait inatteignable. Que ce soit un UUIDv7 est dit par
        # le §1.5 et tenu par le `DEFAULT uuidv7()` de la migration, pas par un type sur le fil.
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
      required: [id, email, displayName]

    Error:
      type: object
      description: |
        La forme d'erreur unique du produit. `code` se grep dans les journaux et ne se traduit pas,
        `message` s'affiche à l'opérateur. Le champ `errors[]` que le §1.4 annonce arrive avec la
        première route qui relaie la passerelle (step-060).
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]
