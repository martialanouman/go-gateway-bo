# Portes de qualité CI (plan d'exécution §0.4, M0). Chaque job reflète un script pnpm, de sorte
# qu'un `pnpm check` local vert signifie une pipeline verte — à deux exceptions près, toutes deux
# assumées : la fraîcheur de `src/routeTree.gen.ts`, qui n'a de sens qu'en CI, et le bout en bout,
# trop lent pour la boucle de travail et donc absent de `check`.
#
# Les portes sont des jobs **indépendants** plutôt que des étapes d'un job unique : une porte qui
# échoue n'empêche plus les autres de rendre leur verdict. On voit une erreur de type ET un test
# rouge dans le même run, au lieu de les découvrir l'une après l'autre.
#
# Le coût est réel et assumé : six runners au lieu d'un, donc six installations de dépendances
# (~10 s chacune, cache chaud). Aujourd'hui le gain est le diagnostic complet, pas la vitesse — les
# portes durent quelques secondes. Il deviendra un gain de temps mural quand les tests d'intégration
# (step-002) et le bout en bout (step-004) arriveront, car eux seuls porteront leurs services et
# leurs navigateurs sans ralentir les autres portes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur une PR rend le run précédent obsolète : l'annuler plutôt que payer les deux.
# Sur `main`, jamais : deux fusions rapprochées laisseraient le commit intermédiaire annulé, donc sans
# verdict — et c'est précisément l'historique dont on veut pouvoir dire qu'il est vert.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # `pnpm install` récupère `@martialanouman/gateway-api-contracts` sur GitHub Packages, publié par
  # le dépôt `go-gateway`. Lecture seule : rien ici ne publie de package.
  packages: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  # `pnpm coverage` exécute les DEUX projets Vitest en une passe et applique les seuils. C'est
  # délibérément une seule porte plutôt que `test` et `test:db` séparés : les seuils ne veulent rien
  # dire mesurés sur la moitié du code, et deux jobs distincts les auraient rendus inapplicables —
  # ce qui était le cas jusqu'ici, la CI ne mesurant la couverture nulle part.
  #
  # Docker est présent sur les runners GitHub et son socket est à l'emplacement attendu ; la
  # résolution du démon (`src/test/docker-host.ts`) ne sert que sur les postes de développement.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm coverage

  # Le sommet de la pyramide, et le job le plus lent : il construit l'application puis la sert avant
  # d'ouvrir un navigateur. Isolé pour que sa durée ne retarde le verdict d'aucune autre porte.
  e2e:
    name: Bout en bout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # `--with-deps` installe les bibliothèques système du navigateur, absentes d'un runner nu.
      # La version vient du lockfile : un navigateur plus récent que la bibliothèque qui le pilote
      # produirait des échecs sans rapport avec le code testé.
      - run: pnpm exec playwright install chromium --with-deps

      # Le build est une étape à part, et non une commande du `webServer` de Playwright : un build
      # cassé se lit alors comme un build cassé, et non comme un serveur qui n'a pas répondu à temps.
      - run: pnpm build

      - run: pnpm e2e

      # Un échec en bout en bout n'est jamais lisible dans un log : il faut la trace, les captures
      # et le DOM. Ils ne sont téléversés que quand le job échoue — les conserver sur un run vert
      # coûterait du stockage pour rien.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  vuln:
    name: Vulnérabilités
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Échoue sur tout avis non trié dans `auditConfig.ignoreGhsas` (pnpm-workspace.yaml). Un
      # nouvel avis doit être lu et justifié, pas absorbé par un seuil de sévérité relevé.
      - run: pnpm vuln

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

      - name: Vérifier que routeTree.gen.ts est à jour
        # Le build régénère l'arbre de routes. S'il diffère de ce qui est commité, c'est qu'une route
        # a été ajoutée sans commiter le fichier généré — la branche compilerait en local et pas
        # ailleurs.
        run: |
          if ! git diff --exit-code -- src/routeTree.gen.ts; then
            echo "::error::src/routeTree.gen.ts est périmé — relancer 'pnpm build' et commiter le résultat."
            exit 1
          fi

  # Porte unique à déclarer dans la protection de branche. Sans elle, il faudrait y lister les six
  # jobs nommément et penser à mettre la règle à jour à chaque ajout de porte — un oubli qui laisse
  # passer silencieusement une porte non requise.
  ci:
    name: CI
    if: always()
    needs: [typecheck, lint, test, e2e, vuln, build]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le verdict des portes
        # `if: always()` fait tourner ce job même quand une porte échoue — sans le test ci-dessous,
        # il réussirait alors et rendrait la protection de branche inopérante.
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::Au moins une porte de qualité a échoué."
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Au moins une porte de qualité a été annulée."
            exit 1
          fi
          echo "Toutes les portes sont vertes."
