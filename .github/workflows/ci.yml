# Les portes tournent en jobs parallèles : une compilation Go rouge n'empêche pas de voir en même
# temps un test rouge. La protection de branche exige le seul check `CI`, qui les agrège — lister les
# jobs nommément se périmerait au premier ajout.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod est la source unique de la version de Go ; ne jamais la répéter ici.
          go-version-file: go.mod
      - run: make build

  test:
    name: Tests Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-go

  lint:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint-go

  vuln:
    name: Vulnérabilités Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vuln-go

  workflows:
    name: Lint des workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint-workflows

  ci:
    name: CI
    # `always()` fait tourner l'agrégation même quand une porte a échoué : sans lui, le check reste
    # « skipped », état qu'une protection de branche accepte.
    if: always()
    needs: [build, test, lint, vuln, workflows]
    runs-on: ubuntu-latest
    steps:
      # La step ne s'exécute que si une porte a échoué, a été annulée ou sautée — et le job échoue
      # alors avec elle. Tout vert, elle est sautée, et le check passe.
      - name: Refuser si une porte n'est pas verte
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::une porte de la CI n'est pas verte : ${{ join(needs.*.result, ', ') }}"
          exit 1
