name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # `pnpm install` récupère `@martialanouman/gateway-api-contracts` sur GitHub
  # Packages, publié par le dépôt `go-gateway`. Lecture seule : rien ici ne
  # publie de package.
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Jamais sur `main` : deux fusions rapprochées laisseraient le commit
  # intermédiaire annulé, donc sans verdict — et c'est précisément l'historique
  # dont on veut pouvoir dire qu'il est vert.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Les portes tournent en parallèle : une erreur de compilation et un test rouge
# se voient au même run. La protection de branche exige le seul check `CI`, qui
# les agrège : elle n'a ainsi qu'un nom à connaître.
#
# **Le `needs` de `ci` est une liste nominale, et rien ne la maintient.** Une
# porte ajoutée sans y être inscrite rougirait sous son propre nom pendant que
# `CI` resterait vert, et la fusion passerait. Ajouter un job, c'est l'ajouter
# aux deux endroits — jusqu'à ce qu'une vérification d'exhaustivité existe.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make vet
      - run: make tidy-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint
      # Un workflow syntaxiquement invalide n'est pas rouge : il est **absent**,
      # et la protection de branche n'a alors plus rien à exiger. C'est arrivé
      # sur cette step même.
      - run: make lint-workflows

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test

  vuln:
    name: Vulnérabilités
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vuln

  typecheck:
    name: Typecheck (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm -C web typecheck

  lint-client:
    name: Lint (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm -C web lint

  test-client:
    name: Test (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm -C web test

  build-client:
    name: Build (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm -C web build
      # Le squelette de chargement à froid doit survivre au build : Vite réécrit
      # les balises de `index.html`, et un squelette perdu rouvrirait le `<body>`
      # vide sur URL collée que step-001 existe pour fermer.
      # `<div …` et non `data-squelette` nu : les sélecteurs du `<style>` portent
      # le même texte, et un grep nu resterait vert alors que le balisage aurait
      # disparu. La mutation l'a montré côté Vitest.
      - run: grep -qE '<div[^>]+data-squelette="rail"' web/dist/index.html

  vuln-client:
    name: Vulnérabilités (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm -C web vuln

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [build, format, lint, test, vuln, typecheck, lint-client, test-client, build-client, vuln-client]
    if: always()
    steps:
      # `contains` sur `needs.*.result` plutôt qu'une agrégation en shell : les
      # expressions GitHub n'admettent que l'apostrophe comme délimiteur, et une
      # agrégation maison se teste mal — celle qu'elle remplace était fausse.
      - name: Agréger le verdict des portes
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
            || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] \
            || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "une porte n'est pas verte : ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
          echo "toutes les portes sont vertes : ${{ join(needs.*.result, ', ') }}"
