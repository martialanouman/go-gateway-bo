# Setup partagé par les jobs de la CI qui ont besoin de la toolchain du client. Les portes tournent en
# parallèle et chacune part d'un runner vierge : sans cette action, les mêmes quatre étapes seraient
# recopiées dans chaque job, et une divergence entre deux copies (version de Node, options de cache)
# produirait des échecs qui ne reproduisent pas en local. Quatre jobs Go sur cinq ne passent pas par
# ici ; « Tests Go » si, parce que ses scénarios godog lancent le mock Prism sur le contrat installé —
# le job le dit chez lui.
name: Setup Node & pnpm
description: Installe pnpm, Node à la version de .nvmrc, et les dépendances du lockfile.

# Les actions référencées ici tournent sur **Node 24** depuis leurs majeures récentes, ce qui exige un
# runner ≥ 2.327.1. Sans objet sur les runners hébergés par GitHub, qui sont à jour — à vérifier le
# jour où ce dépôt passerait à des runners auto-hébergés, car l'échec serait alors au démarrage de
# l'action et non dans son travail.
#
# Elles sont **épinglées sur un condensat de commit**, la version restant en commentaire de fin de
# ligne. Un tag est mutable : quiconque obtient le droit de le déplacer exécute son code ici, avec nos
# jetons. Ne jamais revenir à `@v7` par confort de relecture — c'est Dependabot qui fait avancer ces
# condensats (`.github/dependabot.yml`), et le commentaire qui les rend lisibles.
runs:
  using: composite
  steps:
    # Doit précéder setup-node : c'est ce qui rend `cache: pnpm` résoluble.
    #
    # **v6 au minimum** : c'est la première version qui connaît pnpm 11, celle que déclare
    # `packageManager` dans `package.json`. Aucun `with:` ici, précisément pour que ce champ reste la
    # source unique de la version — l'écrire aussi ici, c'est se préparer à ce que les deux divergent.
    # `package_json_file` est obligatoire depuis que la moitié client vit sous
    # `web/` : l'action lit `packageManager` depuis `GITHUB_WORKSPACE`, avale
    # l'ENOENT, et lève « No pnpm version is specified ». Sans cette ligne, les
    # portes client échouent au deuxième pas, avant `pnpm install`.
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        package_json_file: web/package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # .nvmrc est la source unique de la version de Node ; ne jamais la répéter ici.
        node-version-file: .nvmrc
        cache: pnpm
        # La moitié client vit sous `web/` ; sans ce chemin, setup-node cherche
        # un lockfile à la racine, où il n'y a qu'un module Go.
        cache-dependency-path: web/pnpm-lock.yaml

    # Les contrats de la passerelle viennent de GitHub Packages, qui exige une authentification même
    # en lecture. Le credential va dans la config *utilisateur* du runner et pas dans le `.npmrc` du
    # dépôt : pnpm refuse d'expanser une variable d'environnement dans un credential venant d'un
    # fichier commité — à raison, puisque ce fichier suit le dépôt jusque dans ses forks.
    #
    # `github.token` suffit : le package accorde la lecture à ce dépôt (Package settings → Manage
    # Actions access). Aucun PAT en secret, donc rien qui expire un matin sans prévenir. Le workflow
    # doit accorder `packages: read`.
    #
    # Le jeton passe par l'environnement et non par la ligne de commande : un argument de commande
    # est lisible par tout autre processus du runner via `ps`. Le fichier est réécrit et non
    # complété, pour qu'un runner réutilisé n'accumule pas de jetons périmés dont le premier lu
    # gagnerait, et il est créé sans permission pour les autres utilisateurs.
    - run: |
        umask 077
        printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}

    # --frozen-lockfile : une PR qui modifie package.json sans commiter le lockfile échoue ici plutôt
    # que d'installer silencieusement autre chose que ce qui a été testé en local.
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: web
