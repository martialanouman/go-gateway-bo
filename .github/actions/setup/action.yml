# Setup partagé par tous les jobs de CI. Les portes tournent en parallèle et chacune part d'un runner
# vierge : sans cette action, les mêmes quatre étapes seraient recopiées dans chaque job, et une
# divergence entre deux copies (version de Node, options de cache) produirait des échecs qui ne
# reproduisent pas en local.
name: Setup Node & pnpm
description: Installe pnpm, Node à la version de .nvmrc, et les dépendances du lockfile.

runs:
  using: composite
  steps:
    # Doit précéder setup-node : c'est ce qui rend `cache: pnpm` résoluble.
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        # .nvmrc est la source unique de la version de Node ; ne jamais la répéter ici.
        node-version-file: .nvmrc
        cache: pnpm

    # Les contrats de la passerelle viennent de GitHub Packages, qui exige une authentification même
    # en lecture. Le credential va dans la config *utilisateur* du runner et pas dans le `.npmrc` du
    # dépôt : pnpm refuse d'expanser une variable d'environnement dans un credential venant d'un
    # fichier commité — à raison, puisque ce fichier suit le dépôt jusque dans ses forks.
    #
    # `github.token` suffit : le package accorde la lecture à ce dépôt (Package settings → Manage
    # Actions access). Aucun PAT en secret, donc rien qui expire un matin sans prévenir. Le workflow
    # doit accorder `packages: read`.
    #
    # Le jeton passe par l'environnement et non par la ligne de commande : un argument de commande
    # est lisible par tout autre processus du runner via `ps`. Le fichier est réécrit et non
    # complété, pour qu'un runner réutilisé n'accumule pas de jetons périmés dont le premier lu
    # gagnerait, et il est créé sans permission pour les autres utilisateurs.
    - run: |
        umask 077
        printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}

    # --frozen-lockfile : une PR qui modifie package.json sans commiter le lockfile échoue ici plutôt
    # que d'installer silencieusement autre chose que ce qui a été testé en local.
    - run: pnpm install --frozen-lockfile
      shell: bash
