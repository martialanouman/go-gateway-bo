# pnpm refuse par défaut d'exécuter les scripts d'installation d'une dépendance : un postinstall est
# l'un des vecteurs d'attaque les plus courts de l'écosystème npm. Chaque entrée ci-dessous est une
# autorisation explicite, à justifier.
allowBuilds:
  # esbuild place son binaire natif à l'installation ; sans ce script, aucun build ne fonctionne.
  esbuild: true
  # Refus explicite. `@scarf/scarf` arrive en transitif de `@stoplight/prism-cli` ; son script
  # d'installation n'installe rien — il émet une télémétrie d'installation vers un tiers. Aucune
  # fonctionnalité n'en dépend. Le laisser à `false` plutôt que de le taire : une entrée absente
  # redevient une question à chaque `pnpm install`, et fait échouer la commande.
  '@scarf/scarf': false
  # ⚠ Chaîne disparue : `@testcontainers/postgresql` et `dockerode` ont été retirés
  # en step-001, et aucun des trois paquets n'est plus dans le lockfile. Les refus
  # sont conservés comme garde-fous — ils ne coûtent rien et redeviendraient
  # pertinents si un paquet les réintroduisait — mais la justification d'origine
  # ne s'applique plus à rien.
  cpu-features: false
  protobufjs: false
  ssh2: false

# Corrections de versions transitives. Un avis qu'on peut réellement résoudre ne s'ignore pas : ces
# entrées suppriment les avis de l'arbre au lieu de les inscrire dans `ignoreGhsas`.
#
# Les deux premières viennent du même endroit : `@stoplight/prism-cli > @stoplight/http-spec >
# postman-collection`, qui épingle des versions anciennes. Le sélecteur `parent>enfant` limite
# volontairement la portée à ce chemin — rien d'autre du dépôt ne dépend de ces paquets, et une
# correction globale masquerait le jour où quelque chose d'autre en dépendrait.
overrides:
  # lodash <=4.17.23 : injection de code via `_.template` (GHSA-r5fr-rjxr-66jc, élevée) et deux
  # pollutions de prototype. Aucun correctif en 4.17.x — la première version saine est 4.18.
  'postman-collection>lodash': '^4.18.1'
  # uuid <11.1.1 : lecture hors bornes quand un buffer est fourni à v3/v5/v6
  # (GHSA-w5hq-g745-h8pq). `postman-collection` épingle 8.3.2, dépréciée par ailleurs.
  'postman-collection>uuid': '^11.1.1'
  # js-yaml >=4.0.0 <4.3.1 : consommation CPU quadratique à la résolution d'un `!!omap`
  # (GHSA-5p4m-2wfm-xmqj, élevée). Le correctif de CVE-2026-59870 n'a pas été rétroporté sous 4.3.1.
  # Chemin unique : `openapi-typescript > @redocly/openapi-core`, qui lit les YAML de contrat pendant
  # `make generate` — c'est-à-dire exactement le document qu'un attaquant amont contrôlerait.
  '@redocly/openapi-core>js-yaml': '^4.3.1'
  # Le **même** avis sur la branche 3.x — un seul GHSA couvre les deux, corrigé en 3.15.1 et 4.3.1.
  # Chemin unique : `@stoplight/prism-cli > json-schema-faker > json-schema-ref-parser`.
  'json-schema-ref-parser>js-yaml': '^3.15.1'
  # fast-uri : quatre avis élevés sur la même bibliothèque, tous corrigés en 3.1.6 —
  # GHSA-7p8r-x3mc-p8w7 (confusion d'hôte par barre oblique inversée), puis GHSA-5jgf-p345-68v8
  # (confusion d'hôte, canonicalisation IDN sautée), GHSA-jqff-g426-hqxp (confusion d'hôte par schéma
  # percent-encodé) et GHSA-f65p-4m7j-42xc / GHSA-fph4-wmhf-6fwf (SSRF par autorité malformée ou
  # répétée). Le plancher est passé de 3.1.5 à 3.1.6 le 04/09/2026 : les trois derniers sont apparus
  # après, et `^3.1.5` les laissait tous passer.
  # Arrive par `ajv`, le validateur que Prism utilise pour juger les requêtes.
  'ajv>fast-uri': '^3.1.6'
  # nanoid <3.3.17 : un générateur personnalisé boucle indéfiniment quand la taille vaut zéro
  # (GHSA-2v37-7h3g-55p8, élevée). `pnpm audit` l'annonce par huit chemins, mais `pnpm why` n'en voit
  # qu'un seul parent — `postcss`, qui s'en sert pour nommer ses fichiers de source map. Un sélecteur
  # sur `postcss` les couvre donc tous les huit sans élargir la portée.
  #
  # Avis apparu entre le merge de #42 et le 08/08/2026 : `main` était rouge sans qu'aucun fichier ait
  # bougé, ce que `CLAUDE.md` annonce des bases vivantes. Corrigé ici plutôt que dans sa propre PR
  # parce qu'il bloquait la porte `vuln-web` de step-009 — le mélange est assumé, pas subi.
  'postcss>nanoid': '^3.3.17'
  # qs : deux avis, corrigés respectivement en 6.15.4 et 6.16.0 — GHSA-x5fp-wj9c-mxmx (contournement
  # de la limite de tableau par une clé à virgule entre crochets) et GHSA-4mjr-xmp4-gh2g (déni de
  # service par un `isBuffer` contrôlé par l'appelant). `^6.16.0` couvre les deux ; c'est aussi la
  # dernière publiée. Chemin unique : `@stoplight/json-schema-ref-parser > url > qs`, le parseur qui
  # lit les URL des contrats.
  'url>qs': '^6.16.0'

# Avis `pnpm audit` triés explicitement. Un avis n'entre ici qu'avec sa justification écrite, et
# `pnpm vuln` échoue sur tout ce qui n'y figure pas — c'est ce qui rend le triage conscient plutôt
# qu'un seuil de sévérité relevé en silence. Détail du raisonnement : section « Dépendances » du
# README.
auditConfig:
  # GHSA-qxc2-j82w-r537 — `@faker-js/faker@5.5.3`, exécution de code arbitraire via `helpers.fake`
  # sur un gabarit contrôlé par l'appelant. Chemin unique, et **de développement seulement** :
  # `@stoplight/prism-cli > @stoplight/prism-http > @stoplight/http-spec > postman-collection >
  # @faker-js/faker`. Rien de cette chaîne n'atteint le bundle servi.
  #
  # **Non corrigeable, mesuré le 04/09/2026 plutôt que supposé.** L'avis annonce un correctif en
  # `>=10.4.1` — version qui n'existe pas : la branche va de 10.4.0 à 10.5.0, et aucune 5.x ne porte
  # le correctif. Forcer `postman-collection` sur la 10.6.0 a été essayé : faker 10 est ESM-only
  # (`"type": "module"`) et `postman-collection` le charge en CJS, donc **Prism ne démarre plus du
  # tout** — `postman-collection/lib/superstring/dynamic-variables.js:171`. Le mock est la condition
  # de faisabilité du dépôt ; le prix de cet override est de le perdre.
  #
  # À rouvrir dès que `@stoplight/http-spec` quitte `postman-collection@4.5.0` : c'est le seul
  # porteur, et passé ce jour l'ignore couvrirait une chaîne qui n'existe plus.
  ignoreGhsas:
    - GHSA-qxc2-j82w-r537

# Quarantaine des versions fraîchement publiées. Les compromissions de paquets npm sont détectées et
# dépubliées en quelques heures ; attendre 24 h avant d'installer une version fait porter le risque
# par l'écosystème plutôt que par ce dépôt. Le réglage n'a aucun défaut — sans cette ligne, il n'y a
# pas de quarantaine du tout.
minimumReleaseAge: 1440

# En mode strict, une résolution qui ne trouve aucune version assez ancienne échoue au lieu
# d'installer quand même la version fraîche. Une protection qui se contourne en silence n'en est pas
# une : mieux vaut un `pnpm install` rouge et une décision consciente.
minimumReleaseAgeStrict: true

# `minimumReleaseAgeExclude` est volontairement absent. Y ajouter une entrée revient à installer un
# paquet publié il y a quelques heures — le scénario même que la quarantaine couvre. La seule raison
# valable est un correctif de sécurité qui ne peut pas attendre (`pnpm audit --fix` l'ajoute alors
# lui-même) ; le justifier ici, avec la version.
