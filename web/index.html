<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tableau de bord — Passerelle SMS</title>

    <!--
      Squelette de chargement à froid. Sans rendu serveur, ce document est le même
      pour toutes les URL : s'il ne portait rien, coller un lien profond ouvrirait
      sur un `<body>` vide — un moment que le contrat à cinq états du §1.9 n'a pas.

      Les valeurs sont littérales et non `var(--…)` : la feuille de tokens arrive
      après, et un squelette qui attend le CSS ne sert à rien. Elles dupliquent
      `--nav-width`, `--topbar-height`, `--surface-page` et `--border-chrome` ;
      un écart de quelques pixels décale la silhouette, il ne casse rien.
    -->
    <style>
      html { background: #0c0f14; color-scheme: dark; }
      body { margin: 0; }

      #squelette {
        display: grid;
        grid-template-areas: "barre barre" "rail contenu";
        grid-template-columns: 236px 1fr;
        grid-template-rows: 56px 1fr;
        min-height: 100vh;
        background: #0c0f14;
      }
      [data-squelette="barre"] {
        grid-area: barre;
        border-bottom: 1px solid #1c242f;
      }
      [data-squelette="rail"] {
        grid-area: rail;
        border-right: 1px solid #1c242f;
      }
      [data-squelette="contenu"] {
        grid-area: contenu;
      }
    </style>
  </head>
  <body>
    <!-- `aria-hidden` : une silhouette n'a rien à annoncer à un lecteur d'écran. -->
    <div id="squelette" aria-hidden="true">
      <div data-squelette="barre"></div>
      <div data-squelette="rail"></div>
      <div data-squelette="contenu"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
