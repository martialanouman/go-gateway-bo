<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau de bord — Passerelle SMS</title>

    <!--
      Le style du squelette est inline : la silhouette garde sa forme même si la feuille de
      l'application échoue, et elle est peinte sans attendre le CSS en développement, où Vite l'injecte
      par JavaScript.

      Ce qu'il ne faut pas croire pour autant : en production, Vite émet un `<link rel="stylesheet">`
      dans ce `<head>`, et une feuille liée bloque le rendu du document entier — squelette compris. La
      première peinture attend donc cet aller-retour. Le coût est l'aller-retour, pas le volume, et
      inliner la feuille la rendrait non cacheable entre deux déploiements.

      **Remesuré en step-008, qui y a versé les tokens et les polices :** 10 723 octets, 2 981
      compressés, contre 680 et 379 auparavant. La feuille a grossi d'un facteur 15,7 et le verdict ne
      change pas — un aller-retour reste un aller-retour, et 3 Ko compressés voyagent dans le même
      paquet que 379 octets. Un test plafonne désormais cette taille, pour que la prochaine step qui
      voudrait y verser `components.css` (1 568 lignes en v1.0) rencontre une décision plutôt qu'une
      dérive.

      **Les polices ne sont pas préchargées, et c'est mesuré.** Les sept `.woff2` (144 Ko, latin seul)
      sont découverts après l'analyse de cette feuille — deux allers-retours sérialisés. La parade
      classique est un `<link rel="preload" as="font" crossorigin>`, et elle n'est pas posée : la
      première peinture ne contient **aucun texte visible**, le squelette n'ayant qu'un libellé
      `sr-only`. Le premier texte réel n'arrive qu'après le montage de React, donc après le chunk JS,
      alors que la requête de police part dès l'analyse du CSS — largement avant. `font-display: swap`
      est par ailleurs déjà posé par `@fontsource`, ce qui écarte le FOIT.
    -->
    <style>
      /*
        Ces quatre valeurs peignent le squelette avant toute requête. Elles **recopient** les tokens
        de la charte que la coquille consomme — `--nav-width`, `--topbar-height`, `--surface-page`,
        `--border-subtle` — parce qu'aucune feuille n'est encore chargée à cet instant : c'est une
        duplication que la première peinture impose, pas un choix.

        Les noms restent distincts : ils désignent « ce que le squelette peint », pas les tokens
        eux-mêmes. Ce qui est testé, c'est donc que la **copie soit fidèle** — quatre paires
        confrontées aux tokens dans `chargement-a-froid.test.ts`. Non alignées, le rail sauterait de
        4 px et le canvas changerait de luminance au montage de React.
      */
      :root {
        color-scheme: dark;
        --shell-rail-width: 236px;
        --shell-topbar-height: 56px;
        --skeleton-surface: #0c0f14;
        --skeleton-shape: #1c242f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--skeleton-surface);
        font-family: system-ui, sans-serif;
      }

      #app {
        min-height: 100vh;
      }

      /*
        La silhouette de l'AppShell : un rail de navigation à gauche, une barre supérieure, une zone
        de contenu. Ce n'est pas un rond qui tourne — un spinner est un blanc décoré : il ne dit pas
        ce qui arrive, et la mise en page sursaute quand le contenu le remplace (§1.9).
      */
      .skeleton {
        display: grid;
        grid-template-columns: var(--shell-rail-width) 1fr;
        grid-template-rows: var(--shell-topbar-height) 1fr;
        min-height: 100vh;
      }

      .skeleton__rail {
        grid-row: 1 / 3;
        border-right: 1px solid var(--skeleton-shape);
      }

      .skeleton__topbar {
        border-bottom: 1px solid var(--skeleton-shape);
      }

      .skeleton__content {
        padding: 1.5rem;
      }

      .skeleton__block {
        background: var(--skeleton-shape);
        border-radius: 0.375rem;
      }

      /*
        Règle, et non attribut `style=` : un nonce CSP couvre les éléments `<style>`, jamais les
        attributs, qui exigeraient `'unsafe-inline'`. La politique à nonce de step-186 ferait tomber
        cette déclaration et le texte s'afficherait en clair au milieu du squelette.
      */
      .skeleton__sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }

      .skeleton__rail .skeleton__block {
        height: 1.25rem;
        margin: 1rem;
      }

      .skeleton__topbar .skeleton__block {
        height: 1.25rem;
        margin: 1.125rem 1.5rem;
        max-width: 18rem;
      }


      .skeleton__content .skeleton__block {
        height: 5rem;
        margin-bottom: 1rem;
      }

      /*
        Le squelette ne pulse pas pour les personnes qui ont demandé moins de mouvement : l'animation
        est un indice de chargement, jamais l'information elle-même — celle-ci est portée par
        `aria-busy` et par le texte annoncé.
      */
      @media (prefers-reduced-motion: no-preference) {
        .skeleton__block {
          animation: skeleton-pulse 1.6s ease-in-out infinite;
        }
      }

      @keyframes skeleton-pulse {
        50% {
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="skeleton" aria-busy="true" aria-live="polite">
        <span class="skeleton__sr-only">Chargement du tableau de bord</span>
        <div class="skeleton__rail" data-skeleton="rail">
          <div class="skeleton__block"></div>
          <div class="skeleton__block"></div>
          <div class="skeleton__block"></div>
          <div class="skeleton__block"></div>
        </div>
        <div class="skeleton__topbar" data-skeleton="topbar">
          <div class="skeleton__block"></div>
        </div>
        <div class="skeleton__content" data-skeleton="content">
          <div class="skeleton__block"></div>
          <div class="skeleton__block"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
