# Environnement local du BFF. Ces deux services ne portent QUE les données que le tableau de bord
# possède : opérateurs, rôles, audit, alertes, notifications, vues sauvegardées. Rien de la
# passerelle — clients, comptes SMPP, connecteurs, CDR et soldes se lisent à travers l'API Admin, à
# chaque requête, et ne sont jamais recopiés ici (§3.2).
#
# Un poste neuf : `docker compose up -d`, puis `make migrate`, puis `make bootstrap`.
#
# Redis n'est pas ici : step-044 le rétablira avec le Pub/Sub qui coordonne les instances. Déclaré
# avant, il tournait sur chaque poste sans qu'une ligne de code le joigne.

services:
  postgres:
    # PostgreSQL 18 et pas moins : `uuidv7()` y est une fonction native, ce qui permet de générer
    # les identifiants côté base sans extension ni code applicatif. Les images `alpine` gardent le
    # téléchargement raisonnable sur un poste de développement.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
    ports:
      - '5432:5432'
    volumes:
      # **Monté sur `/var/lib/postgresql`, pas sur `.../data`.** Depuis la 18, l'image range les données
      # dans un sous-répertoire nommé d'après la version majeure, afin que `pg_upgrade --link` puisse
      # fonctionner sans traverser une frontière de point de montage. Monter l'ancien chemin fait
      # **refuser le démarrage** : le conteneur détecte des données là où il n'en attend plus, et le
      # `docker compose up -d` du démarrage échoue en silence pour qui ne lit pas les logs.
      - postgres-18-data:/var/lib/postgresql
    healthcheck:
      # `pg_isready` répond avant que la base accepte réellement les connexions applicatives ;
      # préciser l'utilisateur et la base évite un `make migrate` lancé une seconde trop tôt.
      test: ['CMD-SHELL', 'pg_isready -U dashboard -d dashboard']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  # Nom distinct de l'ancien `postgres-data` : ce dernier contient une arborescence de données à la
  # racine du volume, héritée du montage précédent, que l'image 18 ne sait pas relire. Le laisser en
  # place ne coûte rien et `docker volume rm go-gateway-bo_postgres-data` s'en débarrasse.
  postgres-18-data:
